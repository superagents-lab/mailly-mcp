<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mailly</title><style>/* MAILLY_CSS */</style></head>
<body><div id="workspace">
  <header class="toolbar"><button id="nav-toggle" class="btn btn-ghost" aria-label="Open navigation">Menu</button><div class="brand"><svg aria-hidden="true" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#526cec"/><path d="M15 44V23h7v3c2-3 8-5 12 0 4-5 15-5 15 5v13h-7V32c0-5-7-5-7 0v12h-7V32c0-5-6-5-6 0v12z" fill="white"/></svg><strong>Mailly</strong></div><span id="account" class="muted"></span><button id="refresh" class="btn btn-ghost cursor-interaction" title="Refresh email">Refresh</button></header>
  <div id="notice" role="status" hidden></div>
  <div id="client-shell"><nav id="app-nav" aria-label="Mailly navigation"></nav><div id="inbox-area">
  <div class="picker-intro"><h1>Inbox</h1><p class="muted">Open an email to read it. Ask the assistant when you need analysis or a reply.</p></div>
  <div class="columns"><aside id="list-pane"><div id="search" role="search"><input id="query" class="form-control" placeholder="Search sender or subject" aria-label="Search email"><button id="search-submit" class="btn cursor-interaction" type="button">Search</button></div><div class="list-heading"><select id="mail-folder" class="btn btn-ghost" aria-label="Mail folders"><option value="inbox">Inbox</option><option value="quarantine">Quarantine</option></select><strong class="sr-only">Inbox</strong><span id="count" class="muted"></span></div><nav id="threads" aria-label="Conversation"><p class="empty">Connecting to Mailly…</p></nav><button id="more" class="btn btn-ghost cursor-interaction" hidden>Load more</button></aside>
  <main id="detail"><div class="empty welcome"><h1>Select a conversation</h1><p>Ask the assistant in chat to analyze email or draft a reply.</p><p class="muted">Drafts are sent only after your review.</p></div></main></div></div><main id="client-page" hidden></main></div>
</div><dialog id="confirmation" aria-labelledby="confirm-title"><h2 id="confirm-title">Review this reply</h2><p id="confirm-recipient"></p><p id="confirm-subject" class="muted"></p><pre id="confirm-body"></pre><div class="actions"><button id="cancel-send" class="btn cursor-interaction">Back to editing</button><button id="confirm-send" class="btn btn-primary brand-action cursor-interaction">Confirm and send</button></div></dialog>
<script>/* MAILLY_SCRIPT */</script></body></html>
